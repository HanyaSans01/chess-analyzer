<!DOCTYPE html>
<html lang="id" class="h-full bg-neutral-900 text-neutral-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Sandbox - Neo Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
        }
        .sq-light { background-color: #eeeed2; color: #769656; }
        .sq-dark { background-color: #769656; color: #eeeed2; }
        .sq-selected { background-color: rgba(255, 255, 51, 0.6) !important; }
        .sq-last-move { background-color: rgba(205, 210, 106, 0.8) !important; }
        .sq-check { background-color: rgba(255, 0, 0, 0.55) !important; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .legal-dot {
            width: 32%;
            height: 32%;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
        }
        .legal-ring {
            width: 85%;
            height: 85%;
            border: 4px solid rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
        }
        .piece-img {
            user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-neutral-950 text-neutral-100 overflow-y-auto selection:bg-emerald-500 selection:text-white pb-10">

    <!-- Header / Nav -->
    <header class="sticky top-0 z-30 bg-neutral-900/90 backdrop-blur border-b border-neutral-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-emerald-950">
                ♟
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight text-white flex items-center gap-2">
                    Chess Sandbox 
                    <span class="text-[10px] font-semibold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-800">AI Powered</span>
                </h1>
                <p class="text-xs text-neutral-400">Chess.com Neo Style • Pure Engine Rules</p>
            </div>
        </div>
        <button onclick="openSettings()" class="w-9 h-9 bg-neutral-800 hover:bg-neutral-700 rounded-xl flex items-center justify-center border border-neutral-700 transition">
            ⚙️
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-3 flex flex-col gap-3">
        
        <!-- Mode Switcher Tabs -->
        <div class="grid grid-cols-2 gap-2 bg-neutral-900 p-1.5 rounded-2xl border border-neutral-800">
            <button id="btnModePlay" onclick="setAppMode('play')" class="py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow transition flex items-center justify-center gap-1.5">
                🎮 Bermain
            </button>
            <button id="btnModeSandbox" onclick="setAppMode('sandbox')" class="py-2 rounded-xl text-xs font-bold bg-transparent text-neutral-400 hover:text-white transition flex items-center justify-center gap-1.5">
                🛠️ Sandbox Edit
            </button>
        </div>

        <!-- Status Bar -->
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl px-4 py-3 flex items-center justify-between shadow-inner">
            <div class="flex items-center gap-2.5">
                <div id="turnDot" class="w-3 h-3 rounded-full bg-white shadow"></div>
                <span id="turnText" class="text-xs font-bold text-neutral-200">Giliran: Putih</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs font-medium text-emerald-400 flex items-center gap-1">🛡️ 100% Legal Engine</span>
                <button onclick="flipBoard()" class="w-7 h-7 bg-neutral-800 hover:bg-neutral-700 rounded-lg flex items-center justify-center text-xs border border-neutral-700">🔄</button>
            </div>
        </div>

        <!-- Game Status Alert Banner -->
        <div id="statusBanner" class="hidden rounded-xl p-2.5 text-xs font-bold text-center transition"></div>

        <!-- Board Container -->
        <div class="relative w-full rounded-2xl overflow-hidden shadow-2xl border-2 border-neutral-800 bg-neutral-900">
            <div id="chessBoard" class="board-grid w-full select-none"></div>
        </div>

        <!-- Action Toolbar -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="undoMove()" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-200 py-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 border border-neutral-800 transition">
                ↩️ Urung
            </button>
            <button onclick="scanScreenshotPrompt()" class="bg-neutral-900 hover:bg-neutral-800 text-emerald-400 py-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 border border-neutral-800 transition">
                📸 Scan Foto
            </button>
            <button onclick="resetBoard()" class="bg-neutral-900 hover:bg-neutral-800 text-red-400 py-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 border border-neutral-800 transition">
                ⏻ Reset
            </button>
        </div>

        <!-- AI Assistant Bottom Bar -->
        <button onclick="triggerAIAutoSolve()" id="aiBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-950 transition">
            ✨ Analisis & AI Auto-Move
        </button>

        <!-- Sandbox Palette Dock (Hidden in Play mode) -->
        <div id="sandboxDock" class="hidden bg-neutral-900 border border-neutral-800 rounded-2xl p-3 flex flex-col gap-2.5">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-neutral-400">Palette Bidak Sandbox</span>
                <button onclick="clearBoard()" class="text-[11px] text-red-400 hover:underline">Kosongkan Papan</button>
            </div>
            <div id="palettePieces" class="grid grid-cols-6 gap-1 bg-neutral-950 p-2 rounded-xl border border-neutral-800"></div>
            <div class="flex items-center justify-between text-xs text-neutral-400 pt-1 border-t border-neutral-800">
                <span>Giliran Setup:</span>
                <button id="btnToggleTurn" onclick="toggleSandboxTurn()" class="px-3 py-1 bg-neutral-800 rounded-lg font-bold text-white border border-neutral-700">Putih</button>
            </div>
        </div>

    </main>

    <!-- Pawn Promotion Modal -->
    <div id="promotionModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 max-w-xs w-full flex flex-col items-center gap-4 text-center shadow-2xl">
            <h3 class="font-bold text-neutral-100 text-sm">Pilih Promosi Pion</h3>
            <div id="promotionOptions" class="flex justify-center gap-3"></div>
        </div>
    </div>

    <input type="file" id="hiddenImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

    <!-- Script Engine & Gemini AI Integration -->
    <script>
        // ==========================================
        // 🔑 MASUKKAN API KEY GEMINI KAMU DI SINI:
        // ==========================================
        const GEMINI_API_KEY = "AQ.Ab8RN6KhwzWYBsp2D2fRzXxnBf_iOMoq49e_pWWLLam2K2InxA";

        const PIECE_SVGS = {

            'wK': `<svg viewBox="0 0 45 45" class="piece-img w-full h-full drop-shadow"><path d="M22.5 6v4m-2-2h4M9 36h27v-3H9v3zm2-5h23v-4H11v4zm2-6h19l1.5-7h-22L13 25zm1.5-9a8 8 0 0 1 16 0h-16z" fill="#ffffff" stroke="#262421" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            'bP': `<svg viewBox="0 0 45 45" class="piece-img w-full h-full drop-shadow"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.96 3.84 2.44 5.03C15.82 27.22 14 29.88 14 33h17c0-3.12-1.82-5.78-4.44-6.97C28.04 24.84 29 23.03 29 21c0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#403d39" stroke="#1a1918" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

            'bB': `<svg viewBox="0 0 45 45" class="piece-img w-full h-full drop-shadow"><g fill="#403d39" stroke="#1a1918" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36h27V32H9v4zM12 30h21v-3H12v3zM15 25h15l-1.5-3h-12l-1.5 3zM16.5 20a6.5 6.5 0 1 1 12 0l-12 0z"/><circle cx="22.5" cy="10" r="2.5"/></g></svg>`,
            'bR': `<svg viewBox="0 0 45 45" class="piece-img w-full h-full drop-shadow"><path d="M9 39h27v-5H9v5zm3-7h21v-4H12v4zm2-6h17v-8H14v8zm-2-10h4v-3h3v3h5v-3h3v3h4v-5H12v5z" fill="#403d39" stroke="#1a1918" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            'bQ': `<svg viewBox="0 0 45 45" class="piece-img w-full h-full drop-shadow"><path d="M9 36h27v-3H9v3zm2-5h23v-4H11v4zm2-6h19l1.5-8h-22L13 25zm-3-11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm12.5-3a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm12.5 3a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" fill="#403d39" stroke="#1a1918" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            'bK': `<svg viewBox="0 0 45 45" class="piece-img w-full h-full drop-shadow"><path d="M22.5 6v4m-2-2h4M9 36h27v-3H9v3zm2-5h23v-4H11v4zm2-6h19l1.5-7h-22L13 25zm1.5-9a8 8 0 0 1 16 0h-16z" fill="#403d39" stroke="#1a1918" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        };

        let game = new Chess();
        let currentMode = 'play';
        let boardFlipped = false;
        let selectedSquare = null;
        let selectedPalettePiece = null;
        let legalMoves = [];
        let sandboxTurn = 'w';
        let pendingPromotionMove = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderBoard();
            renderPalette();
            updateUI();
        });

        function setAppMode(mode) {
            currentMode = mode;
            selectedSquare = null;
            selectedPalettePiece = null;
            
            const btnPlay = document.getElementById('btnModePlay');
            const btnSandbox = document.getElementById('btnModeSandbox');
            const dock = document.getElementById('sandboxDock');

            if (mode === 'play') {
                btnPlay.className = "py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow transition flex items-center justify-center gap-1.5";
                btnSandbox.className = "py-2 rounded-xl text-xs font-bold bg-transparent text-neutral-400 hover:text-white transition flex items-center justify-center gap-1.5";
                dock.classList.add('hidden');
            } else {
                btnSandbox.className = "py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow transition flex items-center justify-center gap-1.5";
                btnPlay.className = "py-2 rounded-xl text-xs font-bold bg-transparent text-neutral-400 hover:text-white transition flex items-center justify-center gap-1.5";
                dock.classList.remove('hidden');
            }
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = '';

            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = [8, 7, 6, 5, 4, 3, 2, 1];

            const displayRanks = boardFlipped ? [...ranks].reverse() : ranks;
            const displayFiles = boardFlipped ? [...files].reverse() : files;
            const history = game.history({ verbose: true });
            const lastMove = history.length > 0 ? history[history.length - 1] : null;

            displayRanks.forEach((rank, rIdx) => {
                displayFiles.forEach((file, fIdx) => {
                    const squareSq = file + rank;
                    const isLight = (files.indexOf(file) + ranks.indexOf(rank)) % 2 === 0;

                    const sqDiv = document.createElement('div');
                    sqDiv.className = `relative flex items-center justify-center ${isLight ? 'sq-light' : 'sq-dark'}`;
                    sqDiv.dataset.square = squareSq;

                    if (fIdx === 0) {
                        const rText = document.createElement('span');
                        rText.className = 'absolute top-0.5 left-1 text-[9px] font-bold opacity-60 pointer-events-none';
                        rText.innerText = rank;
                        sqDiv.appendChild(rText);
                    }
                    if (rIdx === 7) {
                        const fText = document.createElement('span');
                        fText.className = 'absolute bottom-0.5 right-1 text-[9px] font-bold opacity-60 pointer-events-none';
                        fText.innerText = file;
                        sqDiv.appendChild(fText);
                    }

                    if (selectedSquare === squareSq) sqDiv.classList.add('sq-selected');
                    if (lastMove && (lastMove.from === squareSq || lastMove.to === squareSq)) sqDiv.classList.add('sq-last-move');

                    if (game.in_check()) {
                        const pieceObj = game.get(squareSq);
                        if (pieceObj && pieceObj.type === 'k' && pieceObj.color === game.turn()) {
                            sqDiv.classList.add('sq-check');
                        }
                    }

                    const pieceObj = game.get(squareSq);
                    if (pieceObj) {
                        const pieceKey = pieceObj.color + pieceObj.type.toUpperCase();
                        if (PIECE_SVGS[pieceKey]) {
                            const pWrapper = document.createElement('div');
                            pWrapper.className = 'w-full h-full p-1 flex items-center justify-center cursor-pointer pointer-events-none';
                            pWrapper.innerHTML = PIECE_SVGS[pieceKey];
                            sqDiv.appendChild(pWrapper);
                        }
                    }

                    if (currentMode === 'play' && selectedSquare) {
                        const move = legalMoves.find(m => m.to === squareSq);
                        if (move) {
                            const hintDiv = document.createElement('div');
                            hintDiv.className = move.captured ? 'legal-ring' : 'legal-dot';
                            sqDiv.appendChild(hintDiv);
                        }
                    }

                    sqDiv.addEventListener('click', () => handleSquareClick(squareSq));
                    boardEl.appendChild(sqDiv);
                });
            });

            updateUI();
        }

        function handleSquareClick(sq) {
            if (currentMode === 'play') {
                if (selectedSquare) {
                    if (selectedSquare === sq) {
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                        return;
                    }

                    const moveObj = legalMoves.find(m => m.to === sq);
                    if (moveObj) {
                        if (moveObj.flags.includes('p')) {
                            pendingPromotionMove = { from: selectedSquare, to: sq };
                            showPromotionModal(game.turn());
                            return;
                        }

                        game.move({ from: selectedSquare, to: sq });
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                        return;
                    }
                }

                const pieceObj = game.get(sq);
                if (pieceObj && pieceObj.color === game.turn()) {
                    selectedSquare = sq;
                    legalMoves = game.moves({ square: sq, verbose: true });
                } else {
                    selectedSquare = null;
                    legalMoves = [];
                }
                renderBoard();

            } else {
                if (selectedPalettePiece) {
                    if (selectedPalettePiece === 'CLEAR') {
                        game.remove(sq);
                    } else {
                        const color = selectedPalettePiece[0];
                        const type = selectedPalettePiece[1].toLowerCase();
                        game.put({ type, color }, sq);
                    }
                } else {
                    game.remove(sq);
                }
                renderBoard();
            }
        }

        function renderPalette() {
            const pal = document.getElementById('palettePieces');
            pal.innerHTML = '';
